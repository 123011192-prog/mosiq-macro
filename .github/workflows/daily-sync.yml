name: daily-macro-snapshot

# MOSIQ 全球宏观罗盘 · 云端每日管线
# 每天 07:47 Asia/Shanghai（23:47 UTC）：拉取私有引擎仓库 → 跑快照 → 构建 → 双通道发布。

on:
  schedule:
    - cron: "47 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-macro-snapshot
  cancel-in-progress: false

jobs:
  snapshot-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout engine (private)
        uses: actions/checkout@v4
        with:
          repository: 123011192-prog/macro-risk-system
          token: ${{ secrets.SITE_PAT }}
          path: engine

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install engine
        run: pip install -e ./engine

      - name: Run daily snapshot
        working-directory: engine
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/daily_snapshot.py
        timeout-minutes: 15

      - name: Sync snapshot into site
        run: |
          cp engine/outputs/snapshot.json public/data/snapshot.json
          git config user.name "MOSIQ Daily"
          git config user.email "daily@mosiq.local"
          git add public/data/snapshot.json
          git diff --cached --quiet || git commit -m "snapshot $(date +%F)"
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build site
        run: |
          (npm ci || npm install)
          npm run build

      - name: Publish to GitHub Pages
        run: |
          git config user.name "MOSIQ Daily"
          git config user.email "daily@mosiq.local"
          rm -rf .publish-tmp
          git worktree add --force .publish-tmp gh-pages 2>/dev/null || \
            (git worktree add --force --detach .publish-tmp && cd .publish-tmp && git checkout --orphan gh-pages && git rm -rf . >/dev/null 2>&1 || true)
          rsync -a --delete --exclude ".git" dist/ .publish-tmp/
          cd .publish-tmp
          git add -A
          git diff --cached --quiet || git commit -m "snapshot $(date +%F)"
          git push -f origin gh-pages

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages deploy dist --project-name=mosiq-macro --branch=main --commit-dirty=true
